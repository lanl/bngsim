# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This file assumes `bngsim/` is the repository root (the public-release
# layout). If instead the docs are built from a repo where bngsim lives in a
# subdirectory, move this file to that repo's root and prefix the paths below
# with `bngsim/` (e.g. `sphinx.configuration: bngsim/docs/conf.py`).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

# The same build as lint.yml's docs job, which passes `sphinx -W` on every pull
# request: the pinned requirements, and no bngsim install. conf.py puts
# python/ on sys.path and mocks only the compiled core, bngsim._bngsim_core.
# Every public name autodoc documents is defined in Python, and no public class
# inherits from a compiled one, so the mock costs the reference nothing.
#
# This file used to `pip install .` and compile bngsim on Read the Docs. The
# last builds that did took about 620 s of the 900 s limit. From 2026-07-10 on
# they failed: pyproject.toml sets BNGSIM_REQUIRE_KLU=ON for every pip build,
# and the image had no SuiteSparse. Don't bring the compile back.
python:
  install:
    - requirements: docs/requirements-ci.txt
