name: changelog

# Every pull request that changes the shipped library stages its own changelog
# fragment, and none of them edits CHANGELOG.md (issue #668).
#
# Both halves replace an honour system that was missed repeatedly. CONTRIBUTING
# asked for a CHANGELOG entry and nothing checked: #649 and #656 arrived without
# one, and #667 merged with none at all. The second half is the one that removes
# the conflict rather than relocating it — a branch that stages a fragment *and*
# also edits CHANGELOG.md still collides with every other open branch, because
# CHANGELOG.md has exactly one anchor a new entry can go at.
#
# `pull_request` only. On a push to main there is no diff to ask about, and the
# fragments themselves are validated on every branch by the `changelog-fragments`
# pre-commit hook, which lint.yml replays with --all-files.
#
# The file list comes from the pulls API rather than from a `git diff` against a
# deep checkout: it is GitHub's own answer to "what does this pull request
# change", which is the question being asked, and it needs neither fetch-depth: 0
# nor a merge-base. Read-only, so a fork PR's restricted token is enough.

on:
  pull_request:
    # `labeled`/`unlabeled` on top of the three default types, because the escape
    # hatch below is a label: without them, applying `changelog exempt` leaves a
    # red check that only an unrelated commit can clear, and the workflow would
    # be telling maintainers to push empty commits to use its own escape hatch.
    # Measured on this workflow's own pull request, which needs the label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# No `concurrency` block, on purpose. `gh pr create --label` fires `opened` and
# `labeled` together, and with `cancel-in-progress` one of the two runs was
# cancelled. A cancelled run is not neutral: it stays in the commit's status
# rollup beside the one that finished, as a second `fragment staged`, and the
# rollup reads FAILURE. Measured on the first commits of #1407 and #1408, where
# every check that ran passed and the cancelled duplicate was the only red.
# Dropping only `cancel-in-progress` does not close it, because a group still
# cancels a pending run when another queues behind it, and `opened` plus two
# labels is three runs. The job is read-only and takes seconds, so overlapping
# runs cost nothing — they only have to agree, which is why the label below is
# read from the API and not from the payload.

permissions:
  contents: read
  pull-requests: read

jobs:
  fragment:
    name: fragment staged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Names, shape and the 1,200-character limit, over every fragment in the
      # tree. Duplicated from the pre-commit hook on purpose: this job is the one
      # whose name says what is wrong, and a contributor who has not installed
      # the hooks still gets the message.
      - name: The staged fragments are well-formed
        run: python3 ci/changelog.py check

      # Label escape for a change that is genuinely invisible to users — a
      # refactor, a test, a CI fix — and for the release commit, which is the one
      # thing that legitimately writes CHANGELOG.md.
      #
      # The label is read from the pull request as it stands when this step
      # runs, not from `github.event.pull_request.labels`. The payload is a
      # snapshot of the moment the event fired, so the `opened` run of a pull
      # request created with the label and the `labeled` run that follows it
      # need not see the same list. Without cancellation both runs finish and
      # the commit's rollup counts them both (see the note above `on:`), so they
      # must give the same answer, and only a read made at run time does.
      - name: This branch stages its own entry, and edits no shared file
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # `pipefail` is load-bearing, not hygiene: a pipeline's exit status is
        # the last command's, so without it a `gh api` that failed for any
        # reason would hand an empty list to a checker that found nothing to
        # object to, and this job would go green having read nothing. The script
        # refuses an empty list for the same reason — two independent guards,
        # because #664 is what one that can silently pass looks like.
        #
        # The label read is a plain assignment, not `gh api … | grep -q` inside
        # an `if`. There a failed call would read as "no label" and the step
        # would blame a missing fragment on a pull request that carries the
        # label, and under `pipefail` a `grep -q` that exits on its first match
        # can turn that match into a failure. A failed command substitution in a
        # plain assignment ends the step under the runner's `bash -e` instead.
        run: |
          set -o pipefail
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.labels[].name')
          if grep -Fqx 'changelog exempt' <<<"$labels"; then
            echo "changelog: labelled 'changelog exempt', so no entry is required"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --paginate --jq '.[].filename' \
            | python3 ci/changelog.py required --files -
