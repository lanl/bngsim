name: biomodels-probe

# Issue #807: every pinned BioModels download returned HTTP 403 on a GitHub
# runner while the same URLs work from a workstation. This asks, from a runner,
# one model through each host the fetch has used and through the REST API, and
# records each response: the status, where it ended, CloudFront's headers and
# the opening words of an error page. A missing file also answers 403
# ("x-cache: Error from cloudfront"), so a control that does not exist is asked
# too; `server` tells them apart (the origin's Apache for a missing file,
# CloudFront for a refusal at the edge). Then it runs fetch.py's own pinned and
# REST paths from this checkout, so a change to fetch.py, which re-runs this, is
# measured as written.
#
# Its first run (38568772108, on PR #1043): from the runner CloudFront itself
# refused every request, through either host, the control included; from a
# workstation all of them reach the origin. It reports in the job summary and
# never fails: whether that refusal lifts is what it is left here to show (the
# issue's plan, steps 3 and 4).

on:
  pull_request:
    paths:
      - benchmarks/suites/biomodels/fetch.py
      - .github/workflows/biomodels-probe.yml
  workflow_dispatch:

concurrency:
  group: biomodels-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe BioModels from a runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only: fetch.py imports bioservices lazily and falls back
      # from tqdm.
      - name: Ask each host
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}/benchmarks/suites/biomodels
        run: |
          import hashlib, json, logging, os, re, urllib.error, urllib.parse, urllib.request

          import fetch  # this checkout's

          logging.basicConfig(format="fetch.py: %(message)s")
          MODEL = "BIOMD0000000498"
          records = json.loads(fetch.PROVENANCE_MANIFEST.read_text())["records"]
          rec = next(r for r in records if r["id"] == MODEL)
          VERSION, NAME = rec["origin"]["version"], rec["main_file"]
          OLD, NEW = "https://www.ebi.ac.uk/biomodels", fetch.BIOMODELS_BASE
          FILE = "?" + urllib.parse.urlencode({"filename": NAME})  # as fetch.py asks
          URLS = [
              ("old host, metadata", f"{OLD}/{MODEL}?format=json"),
              ("new host, metadata", f"{NEW}/{MODEL}?format=json"),
              ("old host, pinned download", f"{OLD}/model/download/{MODEL}.{VERSION}{FILE}"),
              ("new host, pinned download", f"{NEW}/model/download/{MODEL}.{VERSION}{FILE}"),
              ("new host, latest download", f"{NEW}/model/download/{MODEL}{FILE}"),
              ("control: no such version", f"{NEW}/model/download/{MODEL}.999?filename=nope.xml"),
          ]


          def opening(page: bytes) -> str:
              """An error page's first words. CloudFront's own says why it refused
              ("Request blocked", a geographic restriction); the origin's is
              BioModels' "Access Denied | BioModels" page."""
              html = page.decode("utf-8", "replace")
              tags = r"(?is)<(script|style)\b.*?</\1\s*>|<!--.*?-->|<[^>]+>"
              return " ".join(re.sub(tags, " ", html).split())[:160]


          rows = []
          for label, url in URLS:
              page = ""
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      body = r.read()
                      what = fetch._response(r.status, url, r.geturl(), r.headers)
              except urllib.error.HTTPError as exc:
                  body = b""
                  what = fetch._response(exc.code, url, exc.geturl() or url, exc.headers or {})
                  try:
                      page = opening(exc.read())
                  except Exception as read_exc:
                      page = f"(unreadable: {type(read_exc).__name__})"
              except Exception as exc:
                  body, what = b"", f"{type(exc).__name__}: {exc}"
              rows.append((label, f"{what}; {len(body)} bytes", page))

          # fetch.py's own paths. A failure is also logged by fetch.py itself, above.
          data = fetch._download_versioned(MODEL, VERSION, NAME)
          if data is None:
              pinned = "no SBML"
          elif hashlib.sha256(data).hexdigest() == rec["sha256"]:
              pinned = f"{len(data)} bytes, sha256 matches the manifest"
          else:
              pinned = f"{len(data)} bytes of SBML, but not the manifest's sha256"
          rows.append(("fetch.py, pinned download", pinned, ""))
          data = fetch._download_via_rest(MODEL)
          rest = "no SBML" if data is None else f"{len(data)} bytes of SBML"
          rows.append(("fetch.py, REST fallback", rest, ""))

          for label, result, page in rows:
              print(f"{label}: {result}" + (f"\n    page: {page}" if page else ""))
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as f:
              f.write(f"### BioModels from a runner ({MODEL})\n\n")
              f.write("| request | response | error page |\n|---|---|---|\n")
              for row in rows:
                  f.write("| " + " | ".join(c.replace("|", "\\|") for c in row) + " |\n")
