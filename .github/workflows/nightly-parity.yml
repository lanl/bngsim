name: nightly-parity

# Nightly correctness and efficiency sweep against independent references (GH #702).
#
# Before this workflow nothing ran any oracle sweep on any schedule: the parity
# harness's unit tests ran on every PR, but no job ever handed them two
# trajectories. This runs the real sweeps every night and alerts on what CHANGED:
#
#   job          reference                       corpus
#   sbml         SBML Test Suite expected CSVs    1,824 semantic cases (pinned checkout)
#                DSMTS analytic mean/sd           39 stochastic cases (committed)
#   rr-ode       libRoadRunner                    all 1,323 BioModels SBML (pinned,
#                                                 sha256-checked, cached)
#   bng-ode      BNG2.pl + run_network            592 committed BNGL ODE jobs, twice:
#                                                 the ExprTk interpreter a .net runs by
#                                                 default, and the compiled C path every
#                                                 sensitivity run uses (#689/#699 lived
#                                                 only there)
#   bng-stoch    run_network SSA / NFsim          110 SSA + 235 NF committed BNGL jobs
#   amici-sens   AMICI forward sensitivities      48 of the 50 curated BioModels x 2 methods
#   rr-ssa       libRoadRunner gillespie          the 269 of the 306 SSA-screen BioModels
#                                                 candidates the corpus holds (#806)
#   fd-sens      central differences of bngsim's  53 committed .net models x 2 methods: the
#                own trajectories, and a          only sensitivity oracle a .net model has,
#                tolerance sweep of the           and one independent of AMICI (#804); the
#                analytic columns                 sweep is what sees #1227's class (#1257)
#   differential bngsim's own paths, each         fd-sens's 53 .net models and the BioModels
#                against another: sensitivity     under 1 MB, x 10 checks (#1257)
#                vs plain, FD vs analytic
#                Jacobian, KLU vs dense, cc vs
#                interpreted and MIR, de_DE vs C,
#                8x the output points
#   differential NFsim against RuleMonkey, in     bng-nf's 234 single-segment models,
#   _nf          distribution                     from its reference archive (#1312)
#
# THE REPORT IS THE VERDICT, NOT THE EXIT CODE. Every parity runner exits 1 whenever
# any model is DIFF/EXCEPTION/TIMEOUT and a full corpus always has some; the SBML
# runner exits 0 whatever happens. So each job extracts its report into a per-case
# verdict file and parity_checks/nightly/compare.sh diffs it against
#
#   1. the committed baseline, parity_checks/nightly/baselines/<suite>.json, and
#   2. the previous nightly's verdicts, scheduled or manual on main (catches a
#      regression of a fix that nobody has re-baselined yet).
#
# It alerts on a good case that is no longer good (including one that silently
# drops out or stops being compared), a failing case that starts crashing, a jump
# in bngsim's solver work (steps / RHS / Jacobian evaluations: deterministic, so
# they catch efficiency regressions that runner wall-clock noise would hide), a
# >2x wall-clock blowup, a compiled-arm row that did not run compiled, and a run
# that compared too little. Known failures sit in the baseline and do not re-alert.
#
# ALERTING: the report job opens one tracking issue ("Nightly parity: regressions
# detected") or comments on it if it is already open. A job that could not run at
# all alerts too, because that suite went unchecked. Nothing here blocks a PR.
#
# RE-BASELINING: every run uploads `nightly-<suite>` with verdicts.json, the
# candidate baseline. After a fix improves models (the run summary lists them),
# copy that file over parity_checks/nightly/baselines/<suite>.json in a PR so a
# later regression of the fix alerts against the committed baseline too. See
# parity_checks/nightly/README.md.
#
# REFERENCE SIDE (issue #805). The oracle-backed suites (rr-ode, bng-ode, bng-stoch,
# amici-sens, rr-ssa) run in one of three modes, which the plan job picks:
#
#   replay   Monday to Saturday. Each suite's reference side comes from the
#            published reference archive: a release asset whose sha256 the
#            committed parity_checks/nightly/reference_archive.json pins. No
#            reference engine runs, and neither BNG2.pl nor AMICI is provisioned.
#            An entry that no longer describes its job (a changed model, grid or
#            tolerance) is never compared: the row is REFERENCE_FAILED,
#            archive_stale, which alerts wherever the case was good.
#   live     Sundays. Every reference engine runs, as every night did before, so an
#            oracle-side change (#661) still surfaces within a week.
#   record   On demand only. A live run that also records each suite's reference
#            side, packs it, and publishes the assets as a new reference-data-vN
#            release; the run summary holds the manifest to commit. Nothing
#            replays from the new release until that manifest is committed.
#
# A manual run picks its mode; a pull request replays once a manifest is committed.
# Recording and refreshing the archive: parity_checks/nightly/README.md.
#
# Pull requests that touch this workflow, parity_checks/nightly/ or a leg's own
# code run it too, so a change to the nightly is validated before it lands; there
# a missing baseline is allowed (that is how a new suite's first baseline is
# recorded). A pull request runs only the legs its changed files feed, as
# parity_checks/nightly/pr_legs.py maps them, and the corpus job only where one
# of those reads the corpus (#1387); a scheduled or dispatched run runs them all.
#
# Scheduled workflows run only from the default branch, and GitHub disables them
# after 60 days without repository activity.

on:
  schedule:
    # 08:17 UTC, ~02:17 US Mountain; off the top of the hour. The plan job reads
    # which of the two fired: these strings must match the ones it tests.
    - cron: "17 8 * * 1-6" # replay
    - cron: "17 8 * * 0" # live, weekly
  workflow_dispatch:
    inputs:
      mode:
        description: "replay: the published reference archive, no reference engine; live: run the reference engines; record: live, then publish a new reference archive"
        type: choice
        options: [replay, live, record]
        default: replay
  pull_request:
    paths:
      - ".github/workflows/nightly-parity.yml"
      - "parity_checks/nightly/**"
      # Each leg's own code, and what they share (#1387). The plan job runs
      # only the legs a PR's files feed (parity_checks/nightly/pr_legs.py).
      - "parity_checks/_core/**"
      - "parity_checks/rr_parity/**"
      - "parity_checks/bng_parity/**"
      - "parity_checks/amici_parity/**"
      - "parity_checks/fd_sens/**"
      - "parity_checks/differential/**"
      - "benchmarks/suites/sbml_test_suite/**"
      - "benchmarks/_effort.py"
      # The corpus job hashes it into its key and checks the mirror against it.
      - "benchmarks/suites/biomodels/biomodels_provenance.json"
      - "harness/**"
      # A re-baseline PR only copies a verdict file a nightly already produced;
      # re-running hours of sweeps to validate that would buy nothing.
      - "!parity_checks/nightly/baselines/**"
      - "!parity_checks/nightly/flaky.json"
      # No leg reads documentation.
      - "!**/*.md"

permissions:
  contents: read
  actions: read # compare.sh downloads the previous night's verdicts

concurrency:
  group: nightly-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  NIGHTLY_OUT: nightly-out
  ALLOW_MISSING_BASELINE: ${{ github.event_name == 'pull_request' && '1' || '' }}
  # BioNetGen 2.9.3 (BNG2.pl + run_network + NFsim), pinned by sha256 — the same
  # release tarball and hash bngsim-paper's fetch_bionetgen.py records.
  BNG_URL: https://github.com/RuleWorld/bionetgen/releases/download/BioNetGen-2.9.3/BioNetGen-2.9.3-linux.tar.gz
  BNG_SHA256: b85743d422aa3fd112aceb3725dd1b1f2ff1ad829d20d71682680426582bcb5d

jobs:
  # ------------------------------------------------------------------------- #
  # Which reference side the oracle-backed suites use tonight (see the header).
  # ------------------------------------------------------------------------- #
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR's changed files, for the legs step
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # Whether each leg runs: every one, but on a pull request only those its
      # changed files feed (#1387).
      sbml: ${{ steps.legs.outputs.sbml }}
      rr-ode: ${{ steps.legs.outputs.rr-ode }}
      bng-ode: ${{ steps.legs.outputs.bng-ode }}
      rr-ssa: ${{ steps.legs.outputs.rr-ssa }}
      fd-sens: ${{ steps.legs.outputs.fd-sens }}
      differential: ${{ steps.legs.outputs.differential }}
      differential-nf: ${{ steps.legs.outputs.differential-nf }}
      bng-stoch: ${{ steps.legs.outputs.bng-stoch }}
      amici-sens: ${{ steps.legs.outputs.amici-sens }}
      corpus: ${{ steps.legs.outputs.corpus }}
    steps:
      - uses: actions/checkout@v4
      - id: legs
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            # A renamed file's old path too: the leg that read it there changed.
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
            python3 parity_checks/nightly/pr_legs.py < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/legs.txt"
          else
            python3 parity_checks/nightly/pr_legs.py --all > "$RUNNER_TEMP/legs.txt"
          fi
          cat "$RUNNER_TEMP/legs.txt" >> "$GITHUB_OUTPUT"
          echo "Legs: $(grep '=true' "$RUNNER_TEMP/legs.txt" | cut -d= -f1 | paste -sd ' ' -)" >> "$GITHUB_STEP_SUMMARY"
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) mode=${INPUT:-replay} ;;
            schedule) if [ "$SCHEDULE" = "17 8 * * 0" ]; then mode=live; else mode=replay; fi ;;
            *) if [ -f parity_checks/nightly/reference_archive.json ]; then mode=replay; else mode=live; fi ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Reference side: **$mode**" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------- #
  # The BioModels SBML corpus rr-ode and amici-sens read. It is gitignored
  # (~260 MB), so it is rebuilt from its pinned, sha256-checked sources on a cache
  # miss and restored from the cache otherwise.
  #
  # The whole corpus, 1,323 models: 992 (SBML + SED-ML) from sys-bio/temp-biomodels
  # on GitHub, and the 331 whose SBML only BioModels serves, from bngsim's own copy
  # (fetch_biomodels_mirror.py; one release asset, every file checked against the
  # biomodels suite's provenance manifest), then the committed SBML overrides.
  # BioModels itself is not asked: CloudFront refuses GitHub-hosted runners every
  # request (issue #807, biomodels-probe.yml), and its dataset is CC0, so a copy is
  # allowed. A missing model is a fetch failure.
  # ------------------------------------------------------------------------- #
  corpus:
    name: BioModels corpus
    needs: plan
    if: needs.plan.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        run: echo "key=rr-corpus-v3-${{ hashFiles('parity_checks/rr_parity/ode_jobs.json', 'parity_checks/rr_parity/temp_biomodels_manifest.json', 'parity_checks/rr_parity/fetch_biomodels_mirror.py', 'benchmarks/suites/biomodels/biomodels_provenance.json', 'parity_checks/rr_parity/materialize.py', 'parity_checks/rr_parity/fetch_sedml.py', 'parity_checks/rr_parity/data/sbml_overrides/**') }}" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: parity_checks/rr_parity/models
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Standard library only: no bngsim build needed here.
      - name: Fetch and materialize the corpus (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # SED-ML + SBML: sys-bio/temp-biomodels at the pinned commit, sha256-verified.
          python3 parity_checks/rr_parity/fetch_sedml.py --dest "$RUNNER_TEMP/sedml_source"
          # SBML only BioModels serves: bngsim's pinned copy, sha256-verified.
          python3 parity_checks/rr_parity/fetch_biomodels_mirror.py --dest "$RUNNER_TEMP/biomodels_sbml"
          python3 parity_checks/rr_parity/materialize.py \
            --sedml-dir "$RUNNER_TEMP/sedml_source/final" \
            --sbml-dir "$RUNNER_TEMP/biomodels_sbml"

      # Every job's SBML must be present; a shortfall is a fetch failure.
      - name: Check coverage
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("parity_checks/rr_parity")
          jobs = json.loads((root / "ode_jobs.json").read_text())["jobs"]
          missing = [j["model_id"] for j in jobs if not (root / j["model"]).is_file()]
          msg = f"{len(jobs) - len(missing)}/{len(jobs)} manifest SBML files present"
          print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"BioModels corpus: {msg}\n")
          if missing:
              raise SystemExit(f"models missing: {missing[:10]}")
          PY

      - name: Save the corpus cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: parity_checks/rr_parity/models
          key: ${{ steps.key.outputs.key }}

  # ------------------------------------------------------------------------- #
  # SBML Test Suite (semantic) + DSMTS (stochastic). Seconds + a few minutes; the
  # expected values come from the suite, never from bngsim.
  # ------------------------------------------------------------------------- #
  sbml:
    name: SBML test suite + DSMTS
    needs: plan
    if: needs.plan.outputs.sbml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; print('bngsim', bngsim.__version__); bp.print_identity()"

      - id: pin
        run: echo "commit=$(jq -r .commit harness/sbml_test_suite/SUITE_PIN.json)" >> "$GITHUB_OUTPUT"
      - id: suite-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sbml-test-suite
          key: sbml-test-suite-semantic-${{ steps.pin.outputs.commit }}
      - name: Fetch the pinned semantic suite (cache miss only)
        if: steps.suite-cache.outputs.cache-hit != 'true'
        env:
          SUITE: ${{ runner.temp }}/sbml-test-suite
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout --sparse https://github.com/sbmlteam/sbml-test-suite "$SUITE"
          git -C "$SUITE" sparse-checkout set cases/semantic
          git -C "$SUITE" checkout "$COMMIT"

      # The runner exits 0 whatever it finds, and reads 0 cases (and exits 0) when
      # pointed at the checkout root instead of cases/semantic. The comparison below
      # is the verdict; the floor here catches a run that found nothing to run.
      - name: Run the semantic suite
        env:
          SBML_TEST_SUITE_DIR: ${{ runner.temp }}/sbml-test-suite/cases/semantic
        run: |
          set -o pipefail
          uv run --no-sync python benchmarks/suites/sbml_test_suite/run.py --mode correctness 2>&1 | tail -n 60
          python3 -c "
          import json, sys
          d = json.load(open('benchmarks/suites/sbml_test_suite/results/sbml_test_suite_results.json'))
          print('cases', d['n_cases'], 'in scope', d['n_in_scope'])
          sys.exit(0 if d['n_in_scope'] >= 1500 else 'only %d in-scope cases ran' % d['n_in_scope'])
          "
      - name: Compare (semantic)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh sbml_semantic sbml-suite benchmarks/suites/sbml_test_suite/results/sbml_test_suite_results.json

      # SBML_TEST_SUITE_DIR must NOT be set here: run_dsmts.py reads it as the checkout
      # ROOT and would leave its committed, hash-pinned copy of the cases.
      - name: Run DSMTS
        if: always()
        run: uv run --no-sync python harness/run_dsmts.py --quiet || true
      - name: Compare (DSMTS)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh dsmts dsmts harness/results/dsmts.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-sbml_semantic
          path: nightly-out/sbml_semantic/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-dsmts
          path: nightly-out/dsmts/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # bngsim vs libRoadRunner over the BioModels corpus.
  # ------------------------------------------------------------------------- #
  rr-ode:
    name: RoadRunner ODE parity
    needs: [plan, corpus]
    if: needs.plan.outputs.rr-ode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      # A 16 GB runner is enough for one model at a time, not for several giant
      # compiles at once; extra swap turns a near-miss into a slow step instead of a
      # killed runner (the first run lost rr-ode and amici-sens that way).
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/nightly.swap
          sudo chmod 600 /mnt/nightly.swap
          sudo mkswap /mnt/nightly.swap
          sudo swapon /mnt/nightly.swap
          free -h
      - uses: actions/cache/restore@v4
        with:
          path: parity_checks/rr_parity/models
          key: ${{ needs.corpus.outputs.key }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp, roadrunner; print('bngsim', bngsim.__version__, 'roadrunner', roadrunner.__version__); bp.print_identity()"
      # --timeout 300 rather than the runner's 120 s: four models sit at 115-118 s on
      # an M1 Max (RoadRunner's JIT load dominates), and a timeout that flips with
      # runner speed would alert as a regression.
      # Two passes. The 23 SBML files over 1 MB (up to 6,047 species) run on their
      # own: four of them at once, each auto-compiling ~20 MB of generated C in
      # parallel shards, killed the runner on the first run.
      - name: Select the models the corpus holds
        run: |
          python3 parity_checks/nightly/present_models.py parity_checks/rr_parity/ode_jobs.json --max-bytes 1000000 > "$RUNNER_TEMP/light.txt"
          python3 parity_checks/nightly/present_models.py parity_checks/rr_parity/ode_jobs.json --min-bytes 1000001 > "$RUNNER_TEMP/heavy.txt"
      # Sets ARCHIVE_FLAGS for both passes; on a replay, fetches and checks the archive.
      - name: Reference side (${{ env.MODE }})
        run: python3 parity_checks/nightly/reference_archive.py prepare rr_ode --mode "$MODE" --root "$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
      - name: Run rr_run.py
        env:
          BNGSIM_CODEGEN_CACHE_DIR: ${{ runner.temp }}/codegen
        run: uv run --no-sync python parity_checks/rr_parity/rr_run.py --workers 4 --timeout 300 --models "$(cat "$RUNNER_TEMP/light.txt")" --out "$RUNNER_TEMP/rr_ode.json" $ARCHIVE_FLAGS || true
      # The giants on the interpreted RHS: their auto-codegen compile alone runs past
      # the per-job cap on a 4-core runner, so with it they would only ever report
      # TIMEOUT. These are the only models at or above the 256-species
      # auto-codegen threshold (the light pass tops out at 194), so rr-ode does not
      # exercise SBML auto-codegen; compiled RHS code is covered by bng-ode's codegen
      # arm and by amici-sens, whose bngsim side always runs compiled.
      - name: Run rr_run.py on the giant models
        env:
          BNGSIM_NO_CODEGEN: "1"
        run: |
          reports="$RUNNER_TEMP/rr_ode.json"
          if [ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/heavy.txt")" ]; then
            uv run --no-sync python parity_checks/rr_parity/rr_run.py --workers 2 --timeout 600 \
              --models "$(cat "$RUNNER_TEMP/heavy.txt")" --out "$RUNNER_TEMP/rr_ode_giants.json" $ARCHIVE_FLAGS || true
            reports="$reports,$RUNNER_TEMP/rr_ode_giants.json"
          fi
          echo "REPORTS=$reports" >> "$GITHUB_ENV"
      # Record mode: pack before comparing, so the archive does not hang on tonight's alerts.
      - name: Pack the recorded reference side
        if: env.MODE == 'record'
        run: uv run --no-sync python parity_checks/nightly/reference_archive.py pack rr_ode --dir "$ARCHIVE_DIR" --report "$REPORTS" --baseline parity_checks/nightly/baselines/rr_ode.json --out-dir "$RUNNER_TEMP/reference-out"
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'record'
        with:
          name: reference-rr_ode
          path: ${{ runner.temp }}/reference-out/
          retention-days: 30
          compression-level: 0
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh rr_ode core "$REPORTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-rr_ode
          path: nightly-out/rr_ode/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # bngsim vs BNG2.pl/run_network on the committed BNGL corpus, interpreter and
  # compiled arms. Each arm checks that every good row ran its backend: since #825
  # a >=256-species .net compiles unless pinned, and the interpreter arm once ran
  # 26 jobs compiled with only a wall-time alert to show for it (#872).
  # ------------------------------------------------------------------------- #
  bng-ode:
    name: BNG ODE parity · ${{ matrix.arm }}
    needs: plan
    if: needs.plan.outputs.bng-ode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Both arms replay the bng_ode archive (run_network's side does not depend on how
    # bngsim evaluates its RHS); in record mode only the interpreter arm writes it.
    env:
      MODE: ${{ (matrix.arm == 'codegen' && needs.plan.outputs.mode == 'record') && 'live' || needs.plan.outputs.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: interpreter
            suite: bng_ode
            flags: ""
            expect: "--expect-backend exprtk"
          - arm: codegen
            suite: bng_ode_codegen
            flags: "--codegen"
            expect: "--expect-backend cc"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; from bngsim import _codegen; print('bngsim', bngsim.__version__, 'cc', _codegen._find_c_compiler()); bp.print_identity()"
      # A replay needs neither BNG2.pl nor run_network: the archive holds the .net.
      - name: Fetch BioNetGen 2.9.3
        if: env.MODE != 'replay'
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bng.tgz" "$BNG_URL"
          echo "$BNG_SHA256  $RUNNER_TEMP/bng.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bng"
          tar -xzf "$RUNNER_TEMP/bng.tgz" -C "$RUNNER_TEMP/bng"
          root=$(dirname "$(find "$RUNNER_TEMP/bng" -name BNG2.pl | head -n 1)")
          test -x "$root/bin/run_network"
          echo "BNGPATH=$root" >> "$GITHUB_ENV"
      - name: Reference side (${{ env.MODE }})
        run: python3 parity_checks/nightly/reference_archive.py prepare bng_ode --mode "$MODE" --root "$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
      # An explicit --timeout also retires the per-job timeout overrides, which were
      # sized for parity_sweep's 180 s budget. A fresh codegen cache per run: its key
      # covers the Python emitters, not the C++ core.
      - name: Run bng_ode_run.py
        env:
          BNGSIM_CODEGEN_CACHE_DIR: ${{ runner.temp }}/codegen
        run: uv run --no-sync python parity_checks/bng_parity/bng_ode_run.py --workers 4 --timeout 600 ${{ matrix.flags }} --out "$RUNNER_TEMP/${{ matrix.suite }}.json" $ARCHIVE_FLAGS || true
      - name: Pack the recorded reference side
        if: env.MODE == 'record'
        run: uv run --no-sync python parity_checks/nightly/reference_archive.py pack bng_ode --dir "$ARCHIVE_DIR" --report "$RUNNER_TEMP/${{ matrix.suite }}.json" --baseline parity_checks/nightly/baselines/bng_ode.json --out-dir "$RUNNER_TEMP/reference-out"
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'record'
        with:
          name: reference-bng_ode
          path: ${{ runner.temp }}/reference-out/
          retention-days: 30
          compression-level: 0
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh ${{ matrix.suite }} core "$RUNNER_TEMP/${{ matrix.suite }}.json" ${{ matrix.expect }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.suite }}
          path: nightly-out/${{ matrix.suite }}/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # The broad SBML SSA screen against libRoadRunner's gillespie (#806):
  # parity_checks/rr_parity/ssa_screen.py over the ssa_candidates.json BioModels,
  # read from the same cached materialization rr-ode uses (269 of the 306; the
  # other 37 have no pinned provenance, and --present-only leaves them out
  # rather than reporting them as skips). Per-model cap 120 s in the parallel
  # phase; the serial re-validation of time-event models is capped at 300 s each.
  # The nightly diffs the screen's _core report with verdicts.py, which alerts on
  # PASS -> SKIP / TIMEOUT where diff_ssa_baseline.py does not.
  # ------------------------------------------------------------------------- #
  rr-ssa:
    name: RoadRunner SSA screen
    needs: [plan, corpus]
    if: needs.plan.outputs.rr-ssa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/nightly.swap
          sudo chmod 600 /mnt/nightly.swap
          sudo mkswap /mnt/nightly.swap
          sudo swapon /mnt/nightly.swap
          free -h
      - uses: actions/cache/restore@v4
        with:
          path: parity_checks/rr_parity/models
          key: ${{ needs.corpus.outputs.key }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp, roadrunner; print('bngsim', bngsim.__version__, 'roadrunner', roadrunner.__version__); bp.print_identity()"
      - name: Reference side (${{ env.MODE }})
        run: python3 parity_checks/nightly/reference_archive.py prepare rr_ssa --mode "$MODE" --root "$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
      - name: Run ssa_screen.py
        env:
          BNGSIM_CODEGEN_CACHE_DIR: ${{ runner.temp }}/codegen
        run: |
          uv run --no-sync python parity_checks/rr_parity/ssa_screen.py --corpus biomodels \
            --present-only --jobs 4 --revalidate-timeout 300 \
            --out "$RUNNER_TEMP/ssa_screen.json" --core-out "$RUNNER_TEMP/rr_ssa.json" $ARCHIVE_FLAGS || true
      - name: Pack the recorded reference side
        if: env.MODE == 'record'
        run: uv run --no-sync python parity_checks/nightly/reference_archive.py pack rr_ssa --dir "$ARCHIVE_DIR" --report "$RUNNER_TEMP/rr_ssa.json" --baseline parity_checks/nightly/baselines/rr_ssa.json --out-dir "$RUNNER_TEMP/reference-out"
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'record'
        with:
          name: reference-rr_ssa
          path: ${{ runner.temp }}/reference-out/
          retention-days: 30
          compression-level: 0
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh rr_ssa core "$RUNNER_TEMP/rr_ssa.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-rr_ssa
          path: nightly-out/rr_ssa/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # bngsim's analytic forward sensitivities against central differences of its
  # own trajectories (#804): the one sensitivity check a .net model has (BNG2.pl
  # computes none), and an oracle independent of AMICI. Every model is a tracked
  # .net file, so there is no corpus to fetch and no BNG2.pl. Sensitivities are
  # always compiled (GH #214), hence --expect-backend cc; the differences run
  # on the interpreter, so the reference does not share the code under test.
  # About 7 s of runs on 6 workers locally.
  # ------------------------------------------------------------------------- #
  fd-sens:
    name: Finite-difference sensitivity check
    needs: plan
    if: needs.plan.outputs.fd-sens == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; print('bngsim', bngsim.__version__); bp.print_identity()"
      - name: Run fd_sens_run.py
        run: uv run --no-sync python parity_checks/fd_sens/fd_sens_run.py --workers 4 --out "$RUNNER_TEMP/fd_sens.json" || true
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh fd_sens core "$RUNNER_TEMP/fd_sens.json" --expect-backend cc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-fd_sens
          path: nightly-out/fd_sens/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # bngsim's own paths that should give the same answer, each against another
  # (#1257): a sensitivity run's state against a plain run's, the FD Jacobian
  # against the analytic one, KLU against dense, compiled against interpreted
  # (and cc against MIR on a MIR build), the run under a comma-decimal
  # LC_NUMERIC against C; and three rules for bugs whose answers are right (a
  # sensitivity run refused, a sparsity pattern that misses entries, a backend
  # other than the one asked for). No reference engine: every path is bngsim's.
  # The locale check needs de_DE.UTF-8, which the runner image lacks; without
  # it the runner stops (exit 2), and the missing report alerts.
  # ------------------------------------------------------------------------- #
  differential:
    name: Path-agreement check
    needs: [plan, corpus]
    if: needs.plan.outputs.differential == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: parity_checks/rr_parity/models
          key: ${{ needs.corpus.outputs.key }}
          fail-on-cache-miss: true
      - name: Generate the comma-decimal locale
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -i '^de_DE'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; print('bngsim', bngsim.__version__); bp.print_identity()"
      # --timeout 900, not 300: three of a model's paths compile C, and the cache
      # starts empty each night. On the PR's first run nine models passed the 300 s
      # cap that finish in 22-90 s cold on an M3 Max (BIOMD0000000505: 48 s there),
      # and the slowest that finished took 248 s; a timeout that flips with runner
      # speed would alert as a regression.
      # --timeout 1500, not 900: MODEL1006230049, 0053 and 0077 took 689-894 s
      # across five runs on the same commit's checks, so a cap of 900 (its deadline
      # 810, #1321) flipped their rows with runner speed. The cap costs only the
      # few models that use it.
      - name: Run differential_run.py
        env:
          BNGSIM_CODEGEN_CACHE_DIR: ${{ runner.temp }}/codegen
        run: uv run --no-sync python parity_checks/differential/differential_run.py --workers 4 --timeout 1500 --out "$RUNNER_TEMP/differential.json" || true
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh differential core "$RUNNER_TEMP/differential.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-differential
          path: nightly-out/differential/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # NFsim against RuleMonkey (#1312), on bng_nf's models: a job of its own, as
  # the two engines' ensembles over 234 models cost about 41 CPU-minutes on an
  # M-series machine, which the path-agreement job's cap could not also hold.
  # The models come from the pinned reference archive, which holds the BNG-XML
  # BNG2.pl wrote for each, so no BNG2.pl is needed; both engines are bngsim's,
  # so the archive is inputs only, whatever the mode.
  # ------------------------------------------------------------------------- #
  differential-nf:
    name: Network-free engine agreement
    needs: plan
    if: needs.plan.outputs.differential-nf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; print('bngsim', bngsim.__version__); bp.print_identity()"
      - name: Fetch bng_nf's models
        run: python3 parity_checks/nightly/reference_archive.py fetch bng_nf --dest "$RUNNER_TEMP/bng_nf"
      - name: Run differential_run.py (NF arm)
        run: |
          uv run --no-sync python parity_checks/differential/differential_run.py \
            --fd-sens-jobs '' --rr-jobs '' --ssa-jobs '' --no-locale \
            --nf-archive "$RUNNER_TEMP/bng_nf" --workers 4 --timeout 900 \
            --out "$RUNNER_TEMP/differential_nf.json" || true
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh differential_nf core "$RUNNER_TEMP/differential_nf.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-differential_nf
          path: nightly-out/differential_nf/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # Stochastic tracks against run_network's SSA and standalone NFsim. Seeds are
  # fixed on both sides.
  # ------------------------------------------------------------------------- #
  bng-stoch:
    name: BNG stochastic parity · ${{ matrix.track }}
    needs: plan
    if: needs.plan.outputs.bng-stoch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: ssa
            workers: 4
          - track: nf # an NF model can take several GB; 3 workers on a 16 GB runner
            workers: 3
    steps:
      - uses: actions/checkout@v4
      # A 16 GB runner is enough for one model at a time, not for several giant
      # compiles at once; extra swap turns a near-miss into a slow step instead of a
      # killed runner (the first run lost rr-ode and amici-sens that way).
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/nightly.swap
          sudo chmod 600 /mnt/nightly.swap
          sudo mkswap /mnt/nightly.swap
          sudo swapon /mnt/nightly.swap
          free -h
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Provision from uv.lock
        run: uv sync --extra dev --python 3.12
      - name: Build identity
        run: uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; print('bngsim', bngsim.__version__, 'HAS_NFSIM', bngsim.HAS_NFSIM); bp.print_identity()"
      # A replay needs neither BNG2.pl nor the legacy binaries: the archive holds the
      # .net / BNG-XML and every legacy ensemble.
      - name: Fetch BioNetGen 2.9.3
        if: env.MODE != 'replay'
        run: |
          set -euxo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bng.tgz" "$BNG_URL"
          echo "$BNG_SHA256  $RUNNER_TEMP/bng.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bng"
          tar -xzf "$RUNNER_TEMP/bng.tgz" -C "$RUNNER_TEMP/bng"
          root=$(dirname "$(find "$RUNNER_TEMP/bng" -name BNG2.pl | head -n 1)")
          test -x "$root/bin/run_network"
          test -x "$root/bin/NFsim"
          echo "BNGPATH=$root" >> "$GITHUB_ENV"
      - name: Reference side (${{ env.MODE }})
        run: python3 parity_checks/nightly/reference_archive.py prepare bng_${{ matrix.track }} --mode "$MODE" --root "$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
      - name: Run bng_stoch_run.py
        env:
          BNGSIM_CODEGEN_CACHE_DIR: ${{ runner.temp }}/codegen
        run: uv run --no-sync python parity_checks/bng_parity/bng_stoch_run.py --track ${{ matrix.track }} --workers ${{ matrix.workers }} --timeout 1800 --out "$RUNNER_TEMP/bng_${{ matrix.track }}.json" $ARCHIVE_FLAGS || true
      - name: Pack the recorded reference side
        if: env.MODE == 'record'
        run: uv run --no-sync python parity_checks/nightly/reference_archive.py pack bng_${{ matrix.track }} --dir "$ARCHIVE_DIR" --report "$RUNNER_TEMP/bng_${{ matrix.track }}.json" --baseline parity_checks/nightly/baselines/bng_${{ matrix.track }}.json --out-dir "$RUNNER_TEMP/reference-out"
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'record'
        with:
          name: reference-bng_${{ matrix.track }}
          path: ${{ runner.temp }}/reference-out/
          retention-days: 30
          compression-level: 0
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh bng_${{ matrix.track }} core "$RUNNER_TEMP/bng_${{ matrix.track }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-bng_${{ matrix.track }}
          path: nightly-out/bng_${{ matrix.track }}/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # bngsim vs AMICI forward sensitivities (staggered + simultaneous) on the curated
  # 50-model set. AMICI compiles each model to C++; the compiled models are cached
  # across nights (keyed inside by SBML content, so a stale cache is harmless).
  # ------------------------------------------------------------------------- #
  amici-sens:
    name: AMICI forward-sensitivity parity
    needs: [plan, corpus]
    if: needs.plan.outputs.amici-sens == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      # A 16 GB runner is enough for one model at a time, not for several giant
      # compiles at once; extra swap turns a near-miss into a slow step instead of a
      # killed runner (the first run lost rr-ode and amici-sens that way).
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/nightly.swap
          sudo chmod 600 /mnt/nightly.swap
          sudo mkswap /mnt/nightly.swap
          sudo swapon /mnt/nightly.swap
          free -h
      - uses: actions/cache/restore@v4
        with:
          path: parity_checks/rr_parity/models
          key: ${{ needs.corpus.outputs.key }}
          fail-on-cache-miss: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: amici # keeps the from-source AMICI wheel out of the other jobs' cache
      # A replay neither builds AMICI nor compiles a model with it.
      - name: Provision from uv.lock (with the pinned AMICI unless replaying)
        run: uv sync --extra dev ${{ env.MODE != 'replay' && '--group amici' || '' }} --python 3.12
      - name: Build identity
        run: |
          uv run --no-sync python -c "import bngsim, bngsim._build_provenance as bp; print('bngsim', bngsim.__version__); bp.print_identity()"
          if [ "$MODE" != replay ]; then uv run --no-sync python -c "import amici; print('amici', amici.__version__)"; fi
      - id: amici-key
        if: env.MODE != 'replay'
        run: echo "prefix=amici-sens-models-${{ runner.os }}-py312-${{ hashFiles('parity_checks/amici_parity/AMICI_PIN.json') }}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: env.MODE != 'replay'
        with:
          path: parity_checks/amici_parity/amici_sens_cache
          key: ${{ steps.amici-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.amici-key.outputs.prefix }}
      # Left out, each for a measured reason:
      #   BIOMD0000000496/497 (~3 MB SBML): both engines' sensitivity runs hit the wall
      #     cap even on a 10-core workstation (TIMEOUT at 900 s); here that is 40
      #     runner-minutes of guaranteed TIMEOUT.
      # (BIOMD0000000608 was skipped here until issue #801: codegen wrote one ydot
      # update per unit of its x1,000,000 coefficients, 66.7 MB of C that could not
      # compile in budget. It now emits one update per species.)
      # BNGSIM_CODEGEN_JOBS=2 bounds the compiler processes per model (3 workers).
      - name: Select the models the corpus holds
        run: python3 parity_checks/nightly/present_models.py parity_checks/amici_parity/amici_ode_jobs.json --skip BIOMD0000000496,BIOMD0000000497 > "$RUNNER_TEMP/models.txt"
      - name: Reference side (${{ env.MODE }})
        run: python3 parity_checks/nightly/reference_archive.py prepare amici_sens --mode "$MODE" --root "$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
      - name: Run amici_sens_run.py
        env:
          BNGSIM_CODEGEN_CACHE_DIR: ${{ runner.temp }}/codegen
          BNGSIM_CODEGEN_JOBS: "2"
        run: uv run --no-sync python parity_checks/amici_parity/amici_sens_run.py --workers 3 --models "$(cat "$RUNNER_TEMP/models.txt")" --out "$RUNNER_TEMP/amici_sens.json" $ARCHIVE_FLAGS || true
      - uses: actions/cache/save@v4
        if: always() && env.MODE != 'replay'
        continue-on-error: true # nothing to save when provisioning failed before the run
        with:
          path: parity_checks/amici_parity/amici_sens_cache
          key: ${{ steps.amici-key.outputs.prefix }}${{ github.run_id }}
      - name: Pack the recorded reference side
        if: env.MODE == 'record'
        run: uv run --no-sync python parity_checks/nightly/reference_archive.py pack amici_sens --dir "$ARCHIVE_DIR" --report "$RUNNER_TEMP/amici_sens.json" --baseline parity_checks/nightly/baselines/amici_sens.json --out-dir "$RUNNER_TEMP/reference-out"
      - uses: actions/upload-artifact@v4
        if: env.MODE == 'record'
        with:
          name: reference-amici_sens
          path: ${{ runner.temp }}/reference-out/
          retention-days: 30
          compression-level: 0
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash parity_checks/nightly/compare.sh amici_sens core "$RUNNER_TEMP/amici_sens.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-amici_sens
          path: nightly-out/amici_sens/
          retention-days: 30

  # ------------------------------------------------------------------------- #
  # Record mode only: publish what the suites recorded as a new reference-data-vN
  # release (not a bngsim release: release.yml publishes v* tags only), and put the
  # manifest to commit in the run summary and the reference-manifest artifact.
  # Every suite or none: if a suite packed nothing (its job died, or a good row had
  # no recorded reference), the manifest step refuses and nothing is published.
  # The tag goes on the default branch's head, not on the recorded commit. A
  # recording takes hours, and run 40899940910's publish was refused (HTTP 403)
  # creating its tag at the recorded commit after a change to this file merged
  # mid-run: this job's token may not make a ref whose workflow files differ from
  # the default branch's. The notes and the manifest name the recorded commit,
  # and a replay reads only the assets and their sha256s.
  # ------------------------------------------------------------------------- #
  publish:
    name: Publish the reference archive
    needs: [plan, rr-ode, bng-ode, bng-stoch, amici-sens, rr-ssa]
    if: always() && needs.plan.outputs.mode == 'record'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reference-*
          path: reference-out
          merge-multiple: true
      - name: Publish the assets and write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ls -l reference-out
          last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | sed -n 's/^reference-data-v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
          tag="reference-data-v$(( ${last:-0} + 1 ))"
          python3 parity_checks/nightly/reference_archive.py manifest --release "$tag" \
            --sidecars reference-out --out reference_archive.json --recorded-by "$RUN_URL" --commit "$GITHUB_SHA" \
            > caveats.md
          {
            echo "Reference-engine outputs for bngsim's nightly parity check (issue #805), recorded by $RUN_URL at $GITHUB_SHA."
            echo
            echo "Not a bngsim release. One asset per suite; each holds a README, entries.json (every entry's model, source and license) and, where any entry is not CC0, bngsim's NOTICE. The nightly replays from these once parity_checks/nightly/reference_archive.json pins them; parity_checks/nightly/README.md has the procedure."
            echo
            echo "The tag points at $DEFAULT_BRANCH's head when this was published, not at the recorded commit, which is the one named above."
          } > notes.md
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$DEFAULT_BRANCH" --latest=false \
            --title "Data: nightly parity reference archive ($tag)" --notes-file notes.md reference-out/*.tar.gz
          {
            echo "### Reference archive $tag published"
            echo
            echo "Commit this as \`parity_checks/nightly/reference_archive.json\` (also the \`reference-manifest\` artifact) for the nightly to replay from it:"
            echo
            echo '```json'
            cat reference_archive.json
            echo '```'
            # A case good in the baseline but not PASS tonight was recorded down
            # whatever path it took tonight; a replay that takes the baseline's path
            # may refuse it. The replay run of the pull request that commits the
            # manifest shows whether any does.
            cat caveats.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-manifest
          path: reference_archive.json
          retention-days: 90

  # ------------------------------------------------------------------------- #
  # One summary for the whole night; on a scheduled or manual run with any alert
  # (or any job that could not run), open or update the tracking issue.
  # ------------------------------------------------------------------------- #
  report:
    name: Report
    needs: [plan, corpus, sbml, rr-ode, bng-ode, bng-stoch, amici-sens, rr-ssa, fd-sens, differential, differential-nf, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: nightly-in
      - name: Summarize
        id: sum
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          diffs=(nightly-in/*/diff-*.json)
          rc=0
          python3 parity_checks/nightly/verdicts.py summarize ${diffs[@]+"${diffs[@]}"} \
            --needs-json "$NEEDS" --run-url "$RUN_URL" --sha "$GITHUB_SHA" --out body.md > /dev/null || rc=$?
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          echo "alert=$([ "$rc" -ne 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue
        if: steps.sum.outputs.alert == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Nightly parity: regressions detected"
        run: |
          set -euo pipefail
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
      - name: Fail the run on any alert
        if: steps.sum.outputs.alert == '1'
        run: exit 1
