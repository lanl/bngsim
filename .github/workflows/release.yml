name: release

# Build release artifacts (wheels + sdist) and publish via PyPI Trusted
# Publishing (OIDC — no API tokens).
#
#   - Manual run (workflow_dispatch): choose `testpypi` (rehearsal) or `pypi`.
#   - Tag push (v*): publishes to PyPI.
#
# Scope: all platforms — Linux (manylinux x86_64), macOS arm64, macOS x86_64
# (Intel, via macos-15-intel), Windows x86_64, + sdist. SuiteSparse/KLU is built
# from source per job; any platform without a wheel still falls back to the sdist.
#
# The publish job runs in the `pypi` / `testpypi` GitHub Environment so it matches
# the trusted-publisher configuration on (Test)PyPI.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # manylinux x86_64
          - os: macos-14             # macOS arm64 (Apple Silicon)
            macos_target: "11.0"
          - os: macos-15-intel       # macOS x86_64 (Intel); macos-13 retired 2025-12-04
            macos_target: "10.15"    # from-source SuiteSparse -> broad target
          - os: windows-latest       # Windows x86_64 (KLU via from-source SuiteSparse)
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # `pypi` for a tag push or an explicit dispatch target of pypi; else `testpypi`.
    environment: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write        # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List collected distributions
        run: ls -la dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Idempotent: skip any file already present for this version (e.g. when
          # backfilling a newly-supported platform's wheels into an existing release).
          skip-existing: true
          repository-url: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  github-release:
    # The GitHub Release is the human-readable half of a publish, and until now it
    # was the hand-made half: 0.11.35 through 0.12.2 shipped to PyPI while the
    # Releases page — and the repo sidebar widget — sat frozen at 0.11.34.
    #
    # Gated on a tag push, so a `workflow_dispatch` TestPyPI rehearsal never
    # creates a public Release. `needs: publish` so the Release only appears for a
    # version that actually reached PyPI.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/edit the Release object
    steps:
      - uses: actions/checkout@v4
      - name: Build the release notes from CHANGELOG.md
        run: python3 ci/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent for the same reason the publish step is: a re-run of a
          # release must converge, not fail on what it already did.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — refreshing its notes."
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "bngsim ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
