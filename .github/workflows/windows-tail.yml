name: windows-tail

# Windows non-NFsim test tail (issue #5). Issue #1 fixed and guarded the NFsim
# cluster on Windows; this job captures the remaining, non-NFsim Windows-only
# failures (codegen / timeout / seed / version / method) so they get concrete
# tracebacks instead of being triaged blind. It builds bngsim on windows-latest
# with the same fast recipe as windows-nfsim.yml (KLU off, from source) and runs
# the tail files with full tracebacks; the pytest log is always uploaded.
#
# It also guards the SSA-JIT propensity export (issue #6): the cc-compiled
# value-specialized propensity library (GH #190) is resolved by name from the
# built DLL, so it needs the same __declspec(dllexport) tag #5 added for the
# Python-side codegen entry points — test_ssa_propensity_export.py fails here if
# the emit drops it.
#
# KLU off is what makes this the ONLY job that can run the no-KLU half of
# test_force_sparse_linear_solver.py (issue #29). force_sparse_linear_solver
# documents itself as a no-op in a build without SuiteSparse, and the assertion
# that it really is one skips on every other job in the matrix — all of which
# build with KLU. The rest of that file's KLU-dependent cases skip here in turn,
# which is the point: the two halves are covered by disjoint jobs.
#
# It is also the only job that compiles AND exercises the RuleMonkey adapter
# (issue #115). native-tests.yml builds with -DBNGSIM_BUILD_RULEMONKEY=OFF, so
# src/rulemonkey_simulator.cpp is not in that build at all; every job that does
# build it (this one, windows-nfsim, the wheels) got it only as a side effect of
# BNGSIM_BUILD_RULEMONKEY defaulting ON, and none was triggered by a change to
# it. A vendored-RuleMonkey bump or an adapter edit could therefore fail to
# compile with nothing red. This job already builds RuleMonkey and already runs
# test_seed_count_rounding.py's RuleMonkey class, so the fix is the trigger
# paths plus test_rulemonkey.py in the file list — no extra build cost.
#
# An MSVC developer environment is set up first so the runtime codegen path
# (bngsim compiles the generated C RHS with cl.exe + LoadLibrary at simulate
# time) has a C compiler on PATH — otherwise every codegen test would fail with
# "No C compiler found" and mask the real per-group failures. The wheel build
# itself uses MSVC, so a compiler-present run is the faithful reproduction of the
# test suite in a build-capable Windows environment.
#
# That sentence is also why the file list below is now the whole cluster (issue
# #295). The paths filter matches every python/tests/test_codegen*.py, and the
# list named 26 of the 43 — so editing one of the other 17 fired this leg and
# got a green check that had not executed it. Seven of them were the cc-backend
# tests (a cached .so, a sharded cc -c + link, bit-identity of the compiled
# artifact): mir.yml omits those on purpose because BNGSIM_CODEGEN_JIT=mir
# produces no .so, and the argument that excuses them there is the argument for
# running them HERE, in the one job that puts cl.exe on PATH for exactly that
# path. They had therefore never executed on Windows anywhere.
#
# Fifteen were added and measured in one workflow_dispatch run before the list
# was changed: +305 passed, +5 skipped, no failures, pytest 44 s → 161 s. The
# two that were left out are declared, with the count, next to the list itself,
# and python/tests/test_ci_run_list_coverage.py fails if a file this leg fires
# on is neither run nor declared — which is the part that keeps the list from
# going stale again the next time somebody adds a test_codegen*.py file.

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "Extra pytest args (e.g. -x, -k some_pattern, or a single file path)"
        required: false
        default: ""
      python_version:
        description: "Python version to build/test against"
        required: false
        default: "3.12"
  push:
    branches: [main]
    paths: &tail_paths
      - "python/bngsim/_codegen.py"
      # In _CODEGEN_SOURCE_MODULES alongside _codegen.py, i.e. it decides what
      # gets emitted (the derivation budgets and every symbolic derivative).
      - "python/bngsim/_jacobian.py"
      - "python/bngsim/_simulator.py"
      - "python/bngsim/_version.py"
      - "python/bngsim/_net_reader.py"
      # Model.load()'s suffix dispatch and the antimony import guard live here.
      # Without these two triggers the dispatch tests would run only when the
      # test file itself changed — i.e. never when the code they guard breaks.
      - "python/bngsim/_model.py"
      - "python/bngsim/_sbml_loader.py"
      - "src/cvode_simulator.cpp"
      - "src/model.cpp"
      - "src/ssa_simulator.cpp"
      # No other workflow both compiles and exercises these — see the note above.
      - "src/rulemonkey_simulator.cpp"
      - "third_party/rulemonkey/**"
      - "include/bngsim/platform_compat.hpp"
      - "python/tests/test_codegen*.py"
      - "python/tests/test_rulemonkey.py"
      - "python/tests/test_jacobian_c_emitter.py"
      - "python/tests/test_model_codegen_sensitivity.py"
      - "python/tests/test_ssa_propensity_export.py"
      - "python/tests/test_timeout.py"
      - "python/tests/test_seed_semantics.py"
      - "python/tests/test_seed_count_rounding.py"
      - "python/tests/test_version_consistency.py"
      - "python/tests/test_method_normalization.py"
      - "python/tests/test_lazy_jacobian.py"
      - "python/tests/test_force_sparse_linear_solver.py"
      - "python/tests/test_exprtk_vendoring.py"
      - "python/tests/test_ic_sensitivity_seed.py"
      - "python/tests/test_model_load_dispatch.py"
      # Issue #164 — the compartment-size write refusal spans the loader
      # (which marks the parameter), model.cpp (which refuses the write),
      # _model.py (compartment_sizes=) and _simulator.py (the sensitivity
      # column). All four are already triggers above; this adds the test.
      - "python/tests/test_compartment_size_write.py"
      - ".github/workflows/windows-tail.yml"
  pull_request:
    paths: *tail_paths

concurrency:
  group: windows-tail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tail-tests:
    name: non-NFsim tail · windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}

      # Put cl.exe on PATH for the runtime codegen compile (see header note).
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build & install bngsim (NFsim on, KLU off)
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # Override the pyproject BNGSIM_REQUIRE_KLU=ON define so the build does
          # not need SuiteSparse; ENABLE_KLU=OFF avoids the KLU autobuild too.
          python -m pip install -v \
            --config-settings=cmake.define.BNGSIM_ENABLE_KLU=OFF \
            --config-settings=cmake.define.BNGSIM_REQUIRE_KLU=OFF \
            --config-settings=cmake.define.BNGSIM_BUILD_TESTS=OFF \
            .
          # pytest to run; scipy + antimony are import-time deps of a handful of
          # codegen tests (models built from antimony/SBML), so install them too
          # or those tests error out on collection instead of exercising codegen.
          # Keep the antimony floor in step with the [antimony]/[test] extras in
          # pyproject.toml -- 3.1.2 was never published to PyPI, 3.1.3 is the
          # first release carrying the repeated-conversion memory fix.
          python -m pip install "pytest>=8.0" "scipy>=1.15" "antimony>=3.1.3"

      - name: Show build / capability / compiler info
        shell: bash
        run: |
          set -euxo pipefail
          python -c "import platform, sys; print(platform.platform()); print(sys.version)"
          python -c "import bngsim; print('bngsim', bngsim.__version__); print('HAS_NFSIM', bngsim.HAS_NFSIM); print('HAS_KLU', bngsim.HAS_KLU)"
          # Confirm the runtime codegen compiler is discoverable.
          python -c "from bngsim import _codegen; print('C compiler:', _codegen._find_c_compiler())"
          command -v cl || echo "cl.exe not on PATH"

      - name: Run non-NFsim tail
        shell: bash
        env:
          # The other KLU-off leg under the audit (issue #179). This one carries
          # the NFsim-off and RuleMonkey-off phrasings that #179 found had drifted
          # into nine spellings for two conditions; they are consolidated onto the
          # two declared strings now, and strict is what stops them drifting again
          # somewhere no default-build run would notice.
          #
          # The step above already prints `_find_c_compiler()` and `command -v cl`
          # for this job; the LOCAL_ONLY tier turns that from something a reader
          # has to check into something the run enforces.
          BNGSIM_SKIP_AUDIT: strict
        run: |
          set -o pipefail
          # Two of the files this leg fires on are deliberately not below, and
          # the reason is the same in both cases: measured on windows-latest,
          # every test they collect skips, so opting them in would buy 17
          # declared skips and zero assertions on a leg whose whole argument is
          # that a reachable skip is a false green (issue #295).
          #
          # not-run: test_codegen_compile_reaping.py -- POSIX-only by construction (module-level skipif on os.name); 4 collected, 4 skipped here
          # not-run: test_codegen_jacobian_sparse.py -- every case is KLU-gated and this leg builds ENABLE_KLU=OFF; runs on windows-klu.yml instead (issue #296)
          # not-run: test_codegen_jit_self_multiply.py -- the issue #413 reproducer needs MIR built AND selected; this leg builds the cc backend, so all five end-to-end cases would skip. mir.yml runs it
          #
          # The second one was a real Windows coverage gap when it was written:
          # no leg anywhere ran pytest on a Windows build with KLU (wheels.yml
          # builds one and only smoke-tests the import), so the sparse-Jacobian
          # emitter -- a symbol resolved by name out of the built DLL, i.e. the
          # half that is platform-specific -- had never run there. Closing it
          # needed a leg, not a list entry, and windows-klu.yml is that leg
          # (issue #296). It stays out HERE for the same reason as before: this
          # job is the ENABLE_KLU=OFF half of the pair, and that is what makes it
          # the only job that can run test_force_sparse_linear_solver.py's
          # no-KLU cases. Turning the flag on to pick up 13 tests would have cost
          # those, which is a trade and not a fix.
          python -m pytest -p no:cacheprovider \
            python/tests/test_version_consistency.py \
            python/tests/test_method_normalization.py \
            python/tests/test_seed_semantics.py \
            python/tests/test_seed_count_rounding.py \
            python/tests/test_rulemonkey.py \
            python/tests/test_lazy_jacobian.py \
            python/tests/test_force_sparse_linear_solver.py \
            python/tests/test_exprtk_vendoring.py \
            python/tests/test_timeout.py \
            python/tests/test_codegen.py \
            python/tests/test_codegen_outputs.py \
            python/tests/test_codegen_chunking.py \
            python/tests/test_codegen_jacobian.py \
            python/tests/test_jacobian_c_emitter.py \
            python/tests/test_model_codegen_sensitivity.py \
            python/tests/test_codegen_xcompartment_sens.py \
            python/tests/test_codegen_sens_budget.py \
            python/tests/test_codegen_output_sens_budget.py \
            python/tests/test_codegen_power_denominator.py \
            python/tests/test_codegen_engine_functions.py \
            python/tests/test_codegen_mratio.py \
            python/tests/test_codegen_jit_prelude.py \
            python/tests/test_codegen_alias_rule.py \
            python/tests/test_codegen_name_scan.py \
            python/tests/test_ssa_propensity_export.py \
            python/tests/test_ic_sensitivity_seed.py \
            python/tests/test_model_load_dispatch.py \
            python/tests/test_compartment_size_write.py \
            python/tests/test_codegen_cache_key.py \
            python/tests/test_codegen_structural_key.py \
            python/tests/test_codegen_shard_compile.py \
            python/tests/test_codegen_sens_obs_func.py \
            python/tests/test_codegen_sens_term_scale.py \
            python/tests/test_codegen_gen_scaling.py \
            python/tests/test_codegen_determinism.py \
            python/tests/test_codegen_sensitivity.py \
            python/tests/test_codegen_functional_dfdp.py \
            python/tests/test_codegen_functional_sens_rhs.py \
            python/tests/test_codegen_mm_sens.py \
            python/tests/test_codegen_sens_rhs_gate.py \
            python/tests/test_codegen_switch_condition_sens.py \
            python/tests/test_codegen_steady_state_mask.py \
            python/tests/test_codegen_steady_state_fd_step.py \
            -rA --tb=long ${{ inputs.pytest_args }} \
            2>&1 | tee tail-windows.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tail-windows-log-py${{ inputs.python_version || '3.12' }}
          path: tail-windows.log
          if-no-files-found: error
