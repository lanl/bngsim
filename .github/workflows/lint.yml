name: lint

# Three jobs: `pre-commit`, described here, `nfsim-vendor`, the vendored-NFsim
# tripwire, and `docs`, the Sphinx build of issue #586; the last two are described
# where they are defined. `pre-commit` and `docs` run at PINNED tool versions.
#
# `pre-commit` replays the project's pre-commit hooks at their PINNED versions, so
# CI and a developer's local `pre-commit run` can never disagree — a version mismatch
# is exactly how drift went unnoticed (a newer local tool formats differently than the
# pinned one). It exists because "nothing in CI runs the hooks" let src/*.cpp and
# include/*.hpp silently drift out of the pinned clang-format (lanl/bngsim #6). #7
# closes the SAME gap for the rest of the config — ruff, ruff-format, mypy, and the
# hygiene hooks — by running the whole suite here instead of only clang-format.
#
# `pre-commit run --all-files` runs every commit-stage hook (clang-format, ruff,
# ruff-format, mypy, and the pre-commit-hooks hygiene set). It does NOT run the local
# pre-push pytest hook (stages: [pre-push]) or the manual local-CI hooks
# (stages: [manual]), so this stays a fast lint gate. --all-files scans the whole tree,
# not just the push diff, so a merge that reintroduces drift is caught even in a file
# it did not touch — hence no `paths:` filter.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (pinned hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit>=3.5"

      # Cache the installed hook environments (clang-format binary, ruff, mypy+numpy,
      # pre-commit-hooks). Keyed on the config so a pinned-version bump busts the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Replays every commit-stage hook at the version pinned in
      # .pre-commit-config.yaml. --show-diff-on-failure prints exactly what to reformat.
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  # The vendored NFsim tripwire (scripts/NFSIM_VENDORING.md). third_party/nfsim/
  # is generated from upstream NFsim plus the patch series under
  # scripts/nfsim_vendor_patches/, and a refresh replaces it wholesale, so a
  # direct edit to it is lost at the next refresh without a word: twice before
  # this job existed, and #1419's shim check landed that way too. Nothing ran
  # the check outside a manual pre-commit stage. This rebuilds the candidate
  # from the base VENDOR.json records and the patch series, then byte-compares
  # its export with the tree and checks CARRY_QUEUE against the patches. It
  # takes seconds, so it has no paths filter, for the reason the pre-commit job
  # has none.
  nfsim-vendor:
    name: vendored NFsim matches its patch series
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replay the patch series onto the recorded base
        run: |
          set -euo pipefail
          base="$(python3 -c 'import json; print(json.load(open("third_party/nfsim/VENDOR.json"))["source"]["base_commit"])')"
          git clone --quiet --filter=blob:none https://github.com/RuleWorld/nfsim.git /tmp/nfsim-vendor-candidate
          git -C /tmp/nfsim-vendor-candidate checkout --quiet -B bngsim/vendor "$base"
          git -C /tmp/nfsim-vendor-candidate -c user.name=ci -c user.email=ci@invalid \
            am --quiet "$GITHUB_WORKSPACE"/scripts/nfsim_vendor_patches/*.patch

      - name: vendor_nfsim.py --verify-clean
        run: python3 scripts/vendor_nfsim.py --nfsim-repo /tmp/nfsim-vendor-candidate --verify-clean

  # The docs build (issue #586): no other gate builds docs/, so a broken
  # cross-reference, an autodoc directive naming a renamed API, or a malformed
  # docstring landed on main and was found by a reader. -W makes a warning a
  # failure, docs/conf.py's `nitpicky = True` makes a reference that resolves to
  # nothing a warning (docs/nitpick-ignore.txt lists the exceptions), and
  # --keep-going reports every one in a single run.
  #
  # It builds the pure-Python package with the compiled core mocked
  # (docs/conf.py's fallback), with the tools pinned in docs/requirements-ci.txt.
  # Read the Docs builds the core, with docs/requirements.txt's unpinned tools
  # and without -W, so a warning only the compiled core or a newer tool produces
  # is not caught here.
  #
  # Under -W an intersphinx inventory that cannot be fetched is a failed build,
  # so the inventories are read from a cache instead (BNGSIM_INTERSPHINX_CACHE):
  # docs/conf.py refreshes each copy when its host answers and keeps it when it
  # does not, so an outage at numpy.org does not fail every PR.
  docs:
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-ci.txt

      - name: Install docs requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements-ci.txt

      # A new key each ISO week, restored from the newest older one, so the copy
      # is at most a week stale when every host answers and the last good one
      # when one does not.
      - name: Intersphinx cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bngsim-intersphinx
          key: intersphinx-${{ steps.week.outputs.week }}
          restore-keys: intersphinx-

      - name: sphinx-build -W
        env:
          BNGSIM_INTERSPHINX_CACHE: ~/.cache/bngsim-intersphinx
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
