name: golden-verify

# Issue #582: the committed goldens (parity_checks/bng_parity/golden/) as a gate.
# Before this, no CI job compared a run against any of them, so a change that
# shifted every trajectory produced a green run and an unchanged golden.json.
#
# `parity_golden.py --verify --gate` re-runs the deterministic allow-listed
# models (GATED_MODELS, nine fast-tier ODE models with committed trajectories)
# through the same bngsim sweep that generated them and compares each with its
# golden entry. An identical checksum passes. One that differs, as it will across
# platforms, passes when every per-variable stat (last, min, max, mean) is within
# |x - y| <= 1e-5·|y| + 1e-6. Anything else fails the job: drift, a run that did
# not complete, a job with nothing to compare, or fewer than all nine compared.
#
# A pull request that changes these numbers on purpose regenerates their entries
# with `parity_golden.py --merge --gate` from output that agrees with BNG2.pl
# (the nightly bng_ode baseline), so what this defends was cross-validated.
#
# The sweep goes through PyBioNetGen's bngsim bridge, so the parity group is
# installed. Its pinned PyBioNetGen builds against this venv and runs
# `pip install numpy` in it, hence the two-step provisioning and the pip below.
# BNG2.pl comes bundled with it. The nine models run in seconds; the bngsim
# build is the cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: golden-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Golden trajectories · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sundials-archive
      - name: "Verification only, #1607: block GitHub release downloads"
        shell: bash
        run: |
          set -euo pipefail
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          url=$("$py" -c 'import json; print(json.load(open("third_party/sundials/VENDOR.json"))["source"]["authoritative_release_asset_url"])')
          # The control, both ways: the first kilobyte of a real release asset
          # arrives before the block and not after it.
          curl -fsSL -r 0-1023 -o /dev/null --max-time 60 "$url"
          line="0.0.0.0 release-assets.githubusercontent.com objects.githubusercontent.com"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$line" >> /c/Windows/System32/drivers/etc/hosts
          else
            echo "$line" | sudo tee -a /etc/hosts >/dev/null
          fi
          if [ "$RUNNER_OS" = macOS ]; then sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true; fi
          if curl -fsSL -r 0-1023 -o /dev/null --max-time 60 "$url"; then
            echo "::error::a GitHub release download still works"; exit 1
          fi
          echo "GitHub release downloads are blocked for the rest of this job"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          prune-cache: true
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: golden-verify-build
          max-size: 500M

      - name: Provision bngsim, then the parity group
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          uv sync --extra dev --python 3.12
          uv pip install --python .venv/bin/python pip
          uv sync --extra dev --group parity --python 3.12

      # libroadrunner's wheel links libpython by name; ubuntu-26.04 has no system
      # 3.12 to satisfy it. See ci/libpython_on_loader_path.sh.
      - name: Let RoadRunner find libpython
        run: bash ci/libpython_on_loader_path.sh

      - name: Verify the gated goldens
        run: |
          uv run --no-sync python parity_checks/bng_parity/parity_golden.py \
            --verify --gate --workers 4 --sweep-out "$RUNNER_TEMP/golden-sweep"
