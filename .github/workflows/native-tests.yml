name: native-tests

# CI gate for the native C++ test suite, driven through ctest.
#
# Until #38 NOTHING in CI built these tests. Every workflow that compiles the
# project passes BNGSIM_BUILD_TESTS=OFF (mir.yml, windows-nfsim.yml,
# windows-tail.yml), and no job ever invoked the binaries — so the suite's only
# gate was a developer remembering to build it by hand. The C++ side had no
# equivalent at any stage of CI.
#
# The original wording here was "the pre-push hook covers python/tests", offered
# as the contrast that made the C++ gap worse. Issue #169 showed that assumption
# was itself the other half of the problem: a local hook covers one platform and
# `--no-verify` removes it, so python/tests had no cross-platform CI gate either.
# python-tests.yml (ubuntu + macos-14, whole suite, default build) is that gate
# now; this job remains the C++ half.
#
# That is not hypothetical. #28 flipped SteadyStateOptions::method from "newton"
# to "integration" and updated the Python side, leaving the C++ assertion in
# test_find_steady_state_methods asserting the old default. The suite sat at
# 49/50 on every branch from that merge until someone built it locally and
# noticed (#36). No CI run could have caught it, which is also why it survived
# so long: a permanently-red suite is worse than a smaller green one, because a
# genuine regression arrives looking exactly like the failure everyone has
# learned to wave off.
#
# #38 closed that gap for test_bngsim alone. This job (#39) drives the WHOLE
# registered suite through `ctest` rather than one named target, so any binary
# added with add_test() in tests/CMakeLists.txt is picked up here without
# editing this workflow: test_bngsim, test_validation, test_lapack_dense_linsol,
# test_c_api, test_seed_count_rounding.
#
# Scope: Linux only, and deliberately lean. KLU, NFsim and RuleMonkey are all
# OFF — the tests run here link none of them, and skipping the vendored builds
# takes the target count from 146 to 81.
#
# LAPACK is the one build input this job now varies deliberately (GH #269).
# It used to be "left at its default", which on a stock ubuntu-latest means
# find_package(LAPACK QUIET) finds nothing — so test_lapack_dense_linsol was
# registered and green here while executing none of the BLAS path, and after
# #265 removed the transitive liblapack from python-tests.yml's Linux leg, NO
# job anywhere built a BLAS on Linux. Two matrix entries now:
#
#   * blas: none — the stock runner, unchanged from before. This is the
#     configuration the manylinux and Windows wheels actually ship (neither
#     resolves a LAPACK), so it is not a degraded stand-in for the other leg;
#     it is the shipped one. The skip counter added to
#     test_lapack_dense_linsol makes what it does NOT cover legible instead of
#     printing "6/6 passed" for four no-ops and two self-comparisons.
#   * blas: liblapack (i.e. apt liblapack-dev) — reference LAPACK on the host,
#     which is what a source install on an HPC or cluster box gets. The leg that
#     executes dgetrf, and the only one that can catch a symbol-decoration or
#     LP64/ILP64 mismatch, since Accelerate (the macOS legs) differs from
#     reference LAPACK/OpenBLAS in exactly those two ways.
#
# Adding the package here cannot weaken lanl/bngsim#178's proof the way adding
# it to python-tests.yml's Linux leg would: this job configures
# -DBNGSIM_ENABLE_KLU=OFF, so it never reaches the SuiteSparse autobuild whose
# self-sufficiency that proof is about. See python-tests.yml's header, which
# gained a third leg of its own for the Python half of the same gap.
#
# NFsim tradeoff (called out explicitly per #39): the two NFsim tests
# (nfsim_library_test, nfsim_simulator_test) exist only when
# BNGSIM_BUILD_NFSIM=ON, so they are NOT registered on this leg and ctest does
# not run them here. That is intentional — windows-nfsim.yml exercises the NFsim
# subsystem, and duplicating the vendored NFsim/RuleMonkey build on this Linux
# gate would cost minutes for no new coverage. If NFsim ever needs Linux CI, add
# a second ctest leg with NFsim ON rather than letting the pair fall through the
# gap the way test_bngsim once did.

on:
  push:
    branches: [main]
    paths: &native_paths
      - "tests/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - ".github/workflows/native-tests.yml"
  pull_request:
    paths: *native_paths

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: C++ unit suite · ubuntu-latest · BLAS ${{ matrix.blas }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stock runner: find_package(LAPACK QUIET) finds nothing. What the
          # manylinux and Windows wheels ship.
          - blas: none
            apt: ""
            expect_lapack: "no"
          # Reference LAPACK: what a source install on a LAPACK-equipped Linux
          # box gets, and the only leg in CI that executes dgetrf on Linux.
          - blas: liblapack
            apt: liblapack-dev
            expect_lapack: "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (BLAS ${{ matrix.blas }})
        run: |
          set -euxo pipefail
          sudo apt-get update
          # matrix.apt is empty on the stock leg — that leg installs no BLAS and
          # is the configuration the manylinux/Windows wheels ship.
          sudo apt-get install -y ninja-build ${{ matrix.apt }}

      - name: Configure (tests ON; KLU / NFsim / RuleMonkey OFF)
        run: |
          set -euxo pipefail
          # LAPACK is left at its default (BNGSIM_ENABLE_LAPACK_DENSE=ON,
          # find_package(LAPACK QUIET)) on BOTH legs — the matrix varies what is
          # installed on the host, not what CMake is told to look for, so the
          # detection logic itself is what gets exercised. Teed for the guard,
          # which cross-checks the "optimized dense solver ..." line against the
          # leg's expectation.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBNGSIM_BUILD_TESTS=ON \
            -DBNGSIM_ENABLE_KLU=OFF \
            -DBNGSIM_REQUIRE_KLU=OFF \
            -DBNGSIM_BUILD_NFSIM=OFF \
            -DBNGSIM_BUILD_RULEMONKEY=OFF \
            2>&1 | tee /tmp/cmake-configure.log

      - name: Build the test suite
        run: |
          set -euxo pipefail
          # Build everything (not one named target) so every test binary ctest
          # might run is compiled — new tests are picked up without editing this.
          cmake --build build -j"$(nproc)"

      - name: Run the full C++ suite (ctest)
        run: |
          set -euxo pipefail
          # ctest drives every add_test() target, so newly-registered binaries
          # run without a workflow edit. --no-tests=error turns a mis-scoped run
          # that matches zero tests into a failure instead of a vacuous
          # "100% passed, 0 tests". The exit code is the gate; teed for the guard.
          ctest --test-dir build --output-on-failure --no-tests=error \
            2>&1 | tee /tmp/ctest.log

      - name: Guard against a false green
        run: |
          set -euo pipefail
          # Two denominators, two ways coverage can silently shrink to green:
          #
          #   1. A whole binary loses its add_test() registration. ctest's own
          #      count drops; --no-tests=error only catches the zero case, so
          #      assert a floor to trip on losing any single binary too.
          #   2. RUN_TEST cases vanish from *inside* test_bngsim. ctest still
          #      sees one passing binary — only that binary's own "N/N tests
          #      passed" line reveals it. This is the exact #28/#36 failure mode.
          #
          # Both floors only rise as tests are added; additions never break them,
          # only silent removals do.
          CTEST_FLOOR=5
          BNGSIM_FLOOR=50

          total="$(grep -oE 'tests failed out of [0-9]+' /tmp/ctest.log \
            | tail -1 | grep -oE '[0-9]+$' || true)"
          if [ -z "$total" ]; then
            echo "::error::No ctest summary line — the suite did not run to completion."
            exit 1
          fi
          echo "ctest registered $total test binaries (floor $CTEST_FLOOR)."
          if [ "$total" -lt "$CTEST_FLOOR" ]; then
            echo "::error::Only $total ctest tests, expected >= $CTEST_FLOOR — a binary lost its add_test()."
            exit 1
          fi

          # ctest sees test_bngsim as a single passing binary and cannot see
          # cases disappear from within it. Re-run it alone (fast, no external
          # deps) and assert its own case count.
          ./build/tests/test_bngsim 2>&1 | tee /tmp/test_bngsim.log
          ran="$(grep -oE '[0-9]+/[0-9]+ tests passed' /tmp/test_bngsim.log | tail -1 || true)"
          ran="${ran#*/}"; ran="${ran%% *}"
          if [ -z "$ran" ]; then
            echo "::error::No 'N/N tests passed' summary from test_bngsim."
            exit 1
          fi
          echo "test_bngsim ran $ran cases (floor $BNGSIM_FLOOR)."
          if [ "$ran" -lt "$BNGSIM_FLOOR" ]; then
            echo "::error::Only $ran test_bngsim cases, expected >= $BNGSIM_FLOOR — cases vanished rather than failed."
            exit 1
          fi

      # Third denominator, and the one this matrix exists for (GH #269). The two
      # above cannot see it: test_lapack_dense_linsol is one green ctest binary
      # whether or not a BLAS is linked, because five of its seven cases are
      # no-ops without one. So assert the LEG got the backend it asked for, at
      # both the point of detection (CMake) and the point of use (the binary),
      # and that the case count that actually ran matches.
      - name: Guard the BLAS dense backend (expected ${{ matrix.expect_lapack }})
        run: |
          set -euo pipefail
          EXPECT="${{ matrix.expect_lapack }}"

          # 1. What CMake resolved. A silent detection regression (a renamed
          #    CMake variable, a probe that stops compiling) would otherwise
          #    just move this leg to the other configuration without a word.
          if grep -q "optimized dense solver ENABLED" /tmp/cmake-configure.log; then
            cmake_saw=yes
          else
            cmake_saw=no
          fi
          grep -E "BNGsim: optimized dense solver" /tmp/cmake-configure.log || true
          if [ "$cmake_saw" != "$EXPECT" ]; then
            echo "::error::CMake reports BLAS dense backend '$cmake_saw', this leg expects '$EXPECT'."
            exit 1
          fi

          # 2. What the test binary sees, and how much of it actually ran. ctest
          #    swallows stdout on success, so re-run it alone (0.03s, no deps).
          ./build/tests/test_lapack_dense_linsol 2>&1 | tee /tmp/test_lapack.log
          bin_saw="$(grep -oE 'lapack_dense_available = (yes|no)' /tmp/test_lapack.log \
            | tail -1 | grep -oE '(yes|no)$' || true)"
          if [ "$bin_saw" != "$EXPECT" ]; then
            echo "::error::test_lapack_dense_linsol reports lapack_dense_available='$bin_saw', expected '$EXPECT'."
            exit 1
          fi

          skipped="$(grep -oE '[0-9]+ SKIPPED' /tmp/test_lapack.log | tail -1 \
            | grep -oE '^[0-9]+' || echo 0)"
          if [ "$EXPECT" = "yes" ]; then
            # The whole point of this leg. A skip here means the backend went
            # missing between configure and run, which is precisely the state
            # that read as "6/6 passed" before #269.
            if [ "$skipped" -ne 0 ]; then
              echo "::error::$skipped LAPACK cases skipped on the leg that installs liblapack-dev — the dgetrf path did not run."
              exit 1
            fi
            echo "All LAPACK dense cases ran (0 skipped)."
          else
            # The no-BLAS leg is expected to skip; assert it SAYS so, so a future
            # change that reverts the skips to silent `return 0` passes is caught.
            if [ "$skipped" -eq 0 ]; then
              echo "::error::No BLAS backend but 0 cases reported skipped — the skip reporting regressed to a false green."
              exit 1
            fi
            echo "No BLAS backend: $skipped LAPACK cases skipped, as expected."
          fi
