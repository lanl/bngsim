name: native-tests

# CI gate for the native C++ test suite, driven through ctest.
#
# Until #38 NOTHING in CI built these tests. Every workflow that compiles the
# project passes BNGSIM_BUILD_TESTS=OFF (mir.yml, windows-nfsim.yml,
# windows-tail.yml), and no job ever invoked the binaries — so the suite's only
# gate was a developer remembering to build it by hand. The pre-push hook
# covers python/tests; the C++ side had no equivalent at any stage.
#
# That is not hypothetical. #28 flipped SteadyStateOptions::method from "newton"
# to "integration" and updated the Python side, leaving the C++ assertion in
# test_find_steady_state_methods asserting the old default. The suite sat at
# 49/50 on every branch from that merge until someone built it locally and
# noticed (#36). No CI run could have caught it, which is also why it survived
# so long: a permanently-red suite is worse than a smaller green one, because a
# genuine regression arrives looking exactly like the failure everyone has
# learned to wave off.
#
# #38 closed that gap for test_bngsim alone. This job (#39) drives the WHOLE
# registered suite through `ctest` rather than one named target, so any binary
# added with add_test() in tests/CMakeLists.txt is picked up here without
# editing this workflow: test_bngsim, test_validation, test_lapack_dense_linsol,
# test_c_api, test_seed_count_rounding.
#
# Scope: Linux only, and deliberately lean. KLU, NFsim and RuleMonkey are all
# OFF — the tests run here link none of them, and skipping the vendored builds
# takes the target count from 146 to 81. LAPACK is left at its default:
# find_package(LAPACK QUIET) degrades to the reference dense solver when
# absent, so the build is fine either way.
#
# NFsim tradeoff (called out explicitly per #39): the two NFsim tests
# (nfsim_library_test, nfsim_simulator_test) exist only when
# BNGSIM_BUILD_NFSIM=ON, so they are NOT registered on this leg and ctest does
# not run them here. That is intentional — windows-nfsim.yml exercises the NFsim
# subsystem, and duplicating the vendored NFsim/RuleMonkey build on this Linux
# gate would cost minutes for no new coverage. If NFsim ever needs Linux CI, add
# a second ctest leg with NFsim ON rather than letting the pair fall through the
# gap the way test_bngsim once did.

on:
  push:
    branches: [main]
    paths: &native_paths
      - "tests/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - ".github/workflows/native-tests.yml"
  pull_request:
    paths: *native_paths

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: C++ unit suite · ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure (tests ON; KLU / NFsim / RuleMonkey OFF)
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBNGSIM_BUILD_TESTS=ON \
            -DBNGSIM_ENABLE_KLU=OFF \
            -DBNGSIM_REQUIRE_KLU=OFF \
            -DBNGSIM_BUILD_NFSIM=OFF \
            -DBNGSIM_BUILD_RULEMONKEY=OFF

      - name: Build the test suite
        run: |
          set -euxo pipefail
          # Build everything (not one named target) so every test binary ctest
          # might run is compiled — new tests are picked up without editing this.
          cmake --build build -j"$(nproc)"

      - name: Run the full C++ suite (ctest)
        run: |
          set -euxo pipefail
          # ctest drives every add_test() target, so newly-registered binaries
          # run without a workflow edit. --no-tests=error turns a mis-scoped run
          # that matches zero tests into a failure instead of a vacuous
          # "100% passed, 0 tests". The exit code is the gate; teed for the guard.
          ctest --test-dir build --output-on-failure --no-tests=error \
            2>&1 | tee /tmp/ctest.log

      - name: Guard against a false green
        run: |
          set -euo pipefail
          # Two denominators, two ways coverage can silently shrink to green:
          #
          #   1. A whole binary loses its add_test() registration. ctest's own
          #      count drops; --no-tests=error only catches the zero case, so
          #      assert a floor to trip on losing any single binary too.
          #   2. RUN_TEST cases vanish from *inside* test_bngsim. ctest still
          #      sees one passing binary — only that binary's own "N/N tests
          #      passed" line reveals it. This is the exact #28/#36 failure mode.
          #
          # Both floors only rise as tests are added; additions never break them,
          # only silent removals do.
          CTEST_FLOOR=5
          BNGSIM_FLOOR=50

          total="$(grep -oE 'tests failed out of [0-9]+' /tmp/ctest.log \
            | tail -1 | grep -oE '[0-9]+$' || true)"
          if [ -z "$total" ]; then
            echo "::error::No ctest summary line — the suite did not run to completion."
            exit 1
          fi
          echo "ctest registered $total test binaries (floor $CTEST_FLOOR)."
          if [ "$total" -lt "$CTEST_FLOOR" ]; then
            echo "::error::Only $total ctest tests, expected >= $CTEST_FLOOR — a binary lost its add_test()."
            exit 1
          fi

          # ctest sees test_bngsim as a single passing binary and cannot see
          # cases disappear from within it. Re-run it alone (fast, no external
          # deps) and assert its own case count.
          ./build/tests/test_bngsim 2>&1 | tee /tmp/test_bngsim.log
          ran="$(grep -oE '[0-9]+/[0-9]+ tests passed' /tmp/test_bngsim.log | tail -1 || true)"
          ran="${ran#*/}"; ran="${ran%% *}"
          if [ -z "$ran" ]; then
            echo "::error::No 'N/N tests passed' summary from test_bngsim."
            exit 1
          fi
          echo "test_bngsim ran $ran cases (floor $BNGSIM_FLOOR)."
          if [ "$ran" -lt "$BNGSIM_FLOOR" ]; then
            echo "::error::Only $ran test_bngsim cases, expected >= $BNGSIM_FLOOR — cases vanished rather than failed."
            exit 1
          fi
